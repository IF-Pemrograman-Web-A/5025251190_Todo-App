<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List Webpage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>To Do List Webpage</h1>
        <button id="theme-toggle">Dark Mode</button>
    </header>
    <main class="todo-container">
        <aside class="left-panel">
            <h2>To Do List</h2>
            <ul class="todo-list"></ul>
            <section class="form-section">
            <h3>Add New task</h3>
                <form>
                    <div class="form-group">
                        <label for="todo-title">Nama Tugas</label>
                        <input type="text" id="todo-title" placeholder="Enter new task " required>
                    </div>
                    <div class="form-group">
                        <label for="todo-priority">Priority</label>
                        <select id="todo-priority">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-submit">Save To Do</button>
                </form>
            </section>
        </aside>
        <section class="right-panel">
            <div class="editor-header">
                <h2>To Do Detail / Editor</h2>
                <span id="detail-priority-badge" class="badge">Priority</span>
            </div>
            
            <div class="editor-body">
                <div class="detail-group">
                    <label>Judul Tugas:</label>
                    <input type="text" id="detail-title" value="" readonly>
                </div>
                <div class="detail-row">
                    <div class="detail-group">
                        <label>Status:</label>
                        <input type="text" id="detail-status" value="" readonly>
                    </div>
                    <div class="detail-group">
                        <label>Tenggat:</label>
                        <input type="text" id="detail-date" value="" readonly>
                    </div>
                </div>
                <div class="detail-row">
                    <div class="detail-group">
                        <label>Ubah Prioritas:</label>
                        <select id="detail-priority" disabled>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                </div>
                <div class="editor-actions">
                    <button type="button" id="btn-edit" class="btn-edit">Edit Task</button>
                    <button type="button" id="btn-delete" class="btn-delete">Delete</button>
                    <button type="button" id="btn-save" class="btn-submit">Save</button>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
