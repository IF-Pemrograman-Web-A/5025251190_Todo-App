<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List Webpage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>To Do List Webpage</h1>
        <button id="theme-toggle" aria-label="Toggle Dark Mode">Dark Mode</button>
    </header>
    <main class="todo-container">
        <aside class="left-panel">
            <h2>To Do List</h2>
            <ul class="todo-list"></ul>
            <section class="form-section">
                <h3>Add New task</h3>
                <form>
                    <div class="form-group">
                        <label for="todo-title">Nama Tugas</label>
                        <input type="text" id="todo-title" placeholder="Enter new task" required>
                    </div>
                    <div class="form-group">
                        <label for="todo-priority">Priority</label>
                        <select id="todo-priority">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Foto Tugas / Kamera</label>
                        <button type="button" id="btn-start-camera" class="btn-edit" style="background-color: #8e44ad; color: white; margin-bottom: 5px;">Buka Kamera</button>
                        <video id="camera-stream" autoplay playsinline style="width: 100%; max-height: 180px; display: none; background: #000; border-radius: 4px; margin-bottom: 5px;"></video>
                        <button type="button" id="btn-capture" class="btn-submit" style="display: none; background-color: #e67e22; margin-bottom: 5px;">Ambil Foto</button>
                        <canvas id="camera-canvas" style="display: none;"></canvas>
                        <input type="file" id="todo-file-input" accept="image/*" style="margin-top: 5px;">
                        <input type="hidden" id="todo-image-data">
                        <div id="form-img-preview" style="margin-top: 5px;"></div>
                    </div>
                    <div class="form-group">
                        <label for="todo-notification">Waktu Notifikasi</label>
                        <input type="datetime-local" id="todo-notification">
                    </div>
                    <button type="submit" class="btn-submit">Save To Do</button>
                </form>
            </section>
        </aside>
        
        <section class="right-panel">
            <div class="editor-header">
                <h2>To Do Detail / Editor</h2>
                <span id="detail-priority-badge" class="badge">Priority</span>
            </div>
            
            <div class="editor-body">
                <div class="detail-group">
                    <label>Judul Tugas:</label>
                    <input type="text" id="detail-title" value="" readonly>
                </div>
                <div class="detail-row">
                    <div class="detail-group">
                        <label>Status:</label>
                        <input type="text" id="detail-status" value="" readonly>
                    </div>
                    <div class="detail-group">
                        <label>Tenggat:</label>
                        <input type="date" id="detail-date" value="" disabled>
                    </div>
                </div>
                <div class="detail-row">
                    <div class="detail-group">
                        <label>Ubah Prioritas:</label>
                        <select id="detail-priority" disabled>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                </div>
                <div class="editor-actions">
                    <button type="button" id="btn-edit" class="btn-edit">Edit Task</button>
                    <button type="button" id="btn-delete" class="btn-delete">Delete</button>
                    <button type="button" id="btn-save" class="btn-submit">Save</button>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
